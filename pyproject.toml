[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oraclarva"
version = "0.1.0"
description = "Reference core for a connectome-driven digital organism"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]
media = ["Pillow>=11,<12"]

[project.scripts]
oraclarva-audit = "oraclarva.audit:main"
oraclarva-smoke = "oraclarva.smoke:main"
oraclarva-body-spec = "oraclarva.body:main"
oraclarva-motor-map-audit = "oraclarva.neuromuscular:main"
oraclarva-kinematics-targets = "oraclarva.kinematics:main"
oraclarva-muscle-atlas-audit = "oraclarva.muscles:main"
oraclarva-source-audit = "oraclarva.sources:main"
oraclarva-organism = "oraclarva.organism:main"
oraclarva-bilateral = "oraclarva.bilateral:main"
oraclarva-pitch = "oraclarva.dorsoventral:main"
oraclarva-spatial = "oraclarva.spatial:main"
oraclarva-environment-input = "oraclarva.environment_inputs:main"
oraclarva-visual = "oraclarva.visual:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
