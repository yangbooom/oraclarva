[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "oraclarva"
version = "0.1.0"
description = "Reference core for a connectome-driven digital organism"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
oraclarva-audit = "oraclarva.audit:main"
oraclarva-smoke = "oraclarva.smoke:main"
oraclarva-body-spec = "oraclarva.body:main"
oraclarva-motor-map-audit = "oraclarva.neuromuscular:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
