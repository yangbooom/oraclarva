name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: pytest
      - run: python tools/export_closed_loop_trajectory.py --check
      - run: python tools/export_bilateral_trajectory.py --check
      - run: python tools/export_environment_input_trajectory.py --check
      - run: python tools/export_native_closed_loop_fixture.py --check
      - run: python tools/export_native_bilateral_fixture.py --check
      - run: python tools/compile_l1_motor_map.py --check
      - run: oraclarva-motor-map-audit
      - run: oraclarva-smoke

  viewer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: viewer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: viewer/package-lock.json
      - run: npm ci
      - run: npm run build

  native-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e '.[test]'
      - run: pytest tests/test_native_parity.py tests/test_native_closed_loop_parity.py tests/test_native_bilateral_parity.py
      - run: python tools/check_native_viewer_trajectory.py
